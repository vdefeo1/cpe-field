function canSeeMoney(){ return role() !== 'foreman' || !!S.settings.crewSeesMoney; }
/** money, or a blank where the crew must not see it */
function cash(n){ return canSeeMoney() ? money(n) : '—'; }
function cash0(n){ return canSeeMoney() ? money0(n) : '—'; }

/* categorical slots 1-4, dark steps — validated on this surface */
const SER = {
  PLAN:{ c:'#3987e5', lbl:'Planned units' },
  ADD: { c:'#d95926', lbl:'Added units' },
  LAB: { c:'#199e70', lbl:'T&E labor' },
  EQP: { c:'#c98500', lbl:'T&E equipment' }
};
const SERK = ['PLAN','ADD','LAB','EQP'];
const SURF = '#161b22';

let SCOPE = 'all';
function scopePts(sc){ return sc === 'all' ? PTS.slice() : PTS.filter(p => p.wo === sc); }

function revenueByDay(sc){
  const map = {};
  const add = (d,k,v) => { if (!d || !v) return; (map[d] = map[d] || { PLAN:0, ADD:0, LAB:0, EQP:0 })[k] += v; };
  scopePts(sc).forEach(p => {
    const r = rec(p.id);
    p.units.forEach(u => { const e = r.units[u.seq];
      if (e && Number(e.qty)) add(e.date, 'PLAN', Number(e.qty)*rateOf(u,e)); });
    r.adders.forEach(a => { if (Number(a.qty)) add(a.date, 'ADD', Number(a.qty)*adderRate(a)); });
    r.te.forEach(x => { add(x.date, x.kind === 'Equipment' ? 'EQP' : 'LAB', teValue(x)); });
  });
  return Object.keys(map).sort().map(d => {
    const o = map[d]; o.date = d; o.total = SERK.reduce((s,k)=>s+o[k],0); return o;
  });
}
function revenueByState(sc){
  const out = {};
  ORDER.forEach(k => out[k] = 0);
  scopePts(sc).forEach(p => out[rec(p.id).status] += ptTotals(p).total);
  return out;
}
function scopeTotals(sc){
  let booked = 0, est = 0, pts = 0, touched = 0;
  scopePts(sc).forEach(p => {
    const t = ptTotals(p); booked += t.total; est += t.estValue; pts++;
    if (t.total > 0) touched++;
  });
  return { booked, est, pts, touched };
}
const kfmt = n => n >= 1000 ? '$' + Math.round(n/1000) + 'k' : '$' + Math.round(n);

function setScope(s){ SCOPE = s; renderHome(); }

/* ---------- stacked column chart (hand-rolled SVG) ---------- */
function dayChart(days, costs){
  const d = days.slice(-14);
  const W = 360, H = 176, L = 34, R = 6, TOP = 14, BOT = 26;
  const max = Math.max(...d.map(x => x.total), 1);
  const step = niceStep(max), top = Math.ceil(max/step)*step;
  const pw = W - L - R, ph = H - TOP - BOT;
  const band = pw / d.length, bw = Math.min(24, band*0.62);
  const y = v => TOP + ph - (v/top)*ph;
  const peak = d.reduce((a,b) => b.total > a.total ? b : a, d[0]);

  let grid = '', ticks = '';
  for (let v = 0; v <= top + 1; v += step){
    grid += `<line x1="${L}" x2="${W-R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="#2b3440" stroke-width="1"/>`;
    ticks += `<text x="${L-5}" y="${(y(v)+3.2).toFixed(1)}" text-anchor="end" font-size="8.5" fill="#6b7a8c">${v?kfmt(v):'0'}</text>`;
  }
  let bars = '';
  d.forEach((x,i) => {
    const cx = L + band*i + (band-bw)/2;
    let acc = 0;
    const segs = SERK.map(k => ({ k, v:x[k] })).filter(s => s.v > 0);
    segs.forEach((s,si) => {
      const y0 = y(acc + s.v), y1 = y(acc);
      let h = y1 - y0;
      const gap = si < segs.length-1 ? 0 : 0;         // gap applied below via inset
      const isTop = si === segs.length-1;
      const inset = si > 0 ? 2 : 0;                    // 2px surface gap between segments
      const hh = Math.max(1, h - inset);
      bars += isTop
        ? `<path d="M${cx} ${(y0+inset+4).toFixed(1)} a4 4 0 0 1 4 -4 h${(bw-8).toFixed(1)} a4 4 0 0 1 4 4 v${(hh-4).toFixed(1)} h${-bw} Z" fill="${SER[s.k].c}"/>`
        : `<rect x="${cx.toFixed(1)}" y="${(y0+inset).toFixed(1)}" width="${bw.toFixed(1)}" height="${hh.toFixed(1)}" fill="${SER[s.k].c}"/>`;
      acc += s.v;
    });
    bars += `<rect x="${(L+band*i).toFixed(1)}" y="${TOP}" width="${band.toFixed(1)}" height="${ph}" fill="transparent"
      onclick="dayDetail('${x.date}')" style="cursor:pointer"><title>${x.date} — ${money(x.total)}</title></rect>`;
    const lbl = d.length > 8 ? (i % 2 ? '' : x.date.slice(5)) : x.date.slice(5);
    if (lbl) bars += `<text x="${(cx+bw/2).toFixed(1)}" y="${H-BOT+13}" text-anchor="middle" font-size="8.5" fill="#6b7a8c">${lbl}</text>`;
  });
  // one direct label, on the peak only
  const pi = d.indexOf(peak);
  const px = L + band*pi + band/2;
  const plabel = `<text x="${px.toFixed(1)}" y="${(y(peak.total)-4).toFixed(1)}" text-anchor="middle"
    font-size="9.5" font-weight="700" fill="#e7edf3">${money0(peak.total)}</text>`;
  let costLine = '';
  if (costs){
    const pts2 = d.map((x,i) => [L + band*i + band/2, y(Math.min(costs[x.date]||0, top))])
                  .filter((_,i) => (costs[d[i].date]||0) > 0);
    if (pts2.length > 1)
      costLine = `<polyline points="${pts2.map(p2 => p2[0].toFixed(1)+','+p2[1].toFixed(1)).join(' ')}"
        fill="none" stroke="#e7edf3" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity=".9"/>`;
    pts2.forEach(p2 => costLine += `<circle cx="${p2[0].toFixed(1)}" cy="${p2[1].toFixed(1)}" r="3"
      fill="#e7edf3" stroke="${SURF}" stroke-width="2"/>`);
  }
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;overflow:visible"
    role="img" aria-label="Daily revenue, stacked by category, with crew cost">
    ${grid}${ticks}${bars}${costLine}${plabel}
    <line x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}" stroke="#3b4553" stroke-width="1"/>
  </svg>
  <p class="hint" style="margin-top:6px">Tap a column for that day's detail.</p>`;
}
function niceStep(max){
  const raw = max/4, p = Math.pow(10, Math.floor(Math.log10(raw)));
  return [1,2,2.5,5,10].map(m => m*p).find(s => s >= raw) || p*10;
}
function legend(withCost){
  return `<div class="row wrap" style="gap:12px;margin-top:8px">${SERK.map(k =>
    `<span class="row" style="gap:5px"><i style="width:9px;height:9px;border-radius:2px;background:${SER[k].c}"></i>
     <span class="hint" style="font-size:11px">${SER[k].lbl}</span></span>`).join('')}
    ${withCost?`<span class="row" style="gap:5px"><i style="width:12px;height:2px;border-radius:1px;background:#e7edf3"></i>
     <span class="hint" style="font-size:11px">Crew cost</span></span>`:''}</div>`;
}
function mixBar(mix, tot){
  const W = 360, H = 18; let x = 0, out = '';
  mix.filter(m => m.v > 0).forEach((m,i,arr) => {
    const w = (m.v/tot)*W - (i < arr.length-1 ? 2 : 0);
    out += `<rect x="${x.toFixed(1)}" y="0" width="${Math.max(0,w).toFixed(1)}" height="${H}" rx="2" fill="${SER[m.k].c}"><title>${SER[m.k].lbl} ${money(m.v)}</title></rect>`;
    x += (m.v/tot)*W;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block" role="img" aria-label="Revenue mix by category">${out}</svg>`;
}
function variance(){
  const rows = scopePts(SCOPE).map(p => {
    const t = ptTotals(p);
    return { p, booked:t.total, est:t.estValue, d:t.total - t.estValue };
  }).filter(r => r.booked > 0).sort((a,b) => Math.abs(b.d) - Math.abs(a.d)).slice(0,8);
  if (!rows.length) return '';
  return `<div class="card"><h3><span class="grow">Biggest variance to design</span></h3>
    <div class="body tight">${rows.map(r => `<button class="itm" onclick="go('point','${r.p.id}')">
      <div class="col"><div class="t">WO ${r.p.wo} · ${r.p.sec} Pt ${r.p.pt}</div>
        <div class="s">est ${money0(r.est)} → booked ${money0(r.booked)}</div></div>
      <div class="r" style="color:${r.d>0?'#f59e0b':'#6ee7b7'};font-weight:700;font-size:13px">
        ${r.d>0?'+':''}${money0(r.d)}</div></button>`).join('')}</div>
    <div class="body"><p class="hint">Over-runs are where a foreman booked more than engineering drew.
      Each one should have a memo or an authorization behind it — tap through to check before it goes to billing.</p></div></div>`;
}
function dayDetail(d){
  const rows = [];
  scopePts(SCOPE).forEach(p => {
    const r = rec(p.id), loc = `WO ${p.wo} · ${p.sec} Pt ${p.pt}`;
    p.units.forEach(u => { const e = r.units[u.seq];
      if (e && e.date === d && Number(e.qty)) rows.push({ k:'PLAN', loc, desc:u.code+' '+u.desc, v:Number(e.qty)*rateOf(u,e) }); });
    r.adders.forEach(a => { if (a.date === d && Number(a.qty)) rows.push({ k:'ADD', loc, desc:a.code+' '+a.desc, v:Number(a.qty)*adderRate(a) }); });
    r.te.forEach(x => { if (x.date !== d) return;

      if (v) rows.push({ k:x.kind === 'Equipment' ? 'EQP' : 'LAB', loc, desc:x.name+` (${x.st||0} ST / ${x.ot||0} OT)`, v }); });

  openSheet(d + ' — ' + money(tot),

      <div class="r" style="color:var(--txt);font-weight:700">${money(r.v)}</div></div>`).join('')
    || '<div class="empty">Nothing booked that day</div>');

function exportRevenueCSV(){

/* ---------- internal cost rates (Project Manager only) ---------- */
function costLaborRate(name){
  if (S.cost.labor[name] != null) return +S.cost.labor[name];
  const l = LAB.find(x => x.name === name);
  return l ? l.st * S.cost.laborPct : 0;
}
function costEquipRate(name){
  if (S.cost.equip[name] != null) return +S.cost.equip[name];
  const e = EQP.find(x => x.name === name);
  return e ? e.rate * S.cost.equipPct : 0;
}
const TYPICAL = ['LINE FOREMAN','JOURNEY LINEMAN','JOURNEY LINEMAN','GROUNDMAN'];
function blendedLaborCost(){
  const av = TYPICAL.map(costLaborRate).filter(Boolean);
  if (av.length) return av.reduce((a,b)=>a+b,0)/av.length;
  return LAB.length ? LAB.reduce((s,l)=>s+l.st,0)/LAB.length*S.cost.laborPct : 0;
}
/** cost of one crew-day. Uses the roster when it exists, otherwise estimates from the header. */
function dayCost(D){
  if (D.roster && D.roster.length){
    let c = 0;
    D.roster.forEach(x => {
      const r = x.kind === 'Equipment' ? costEquipRate(x.name) : costLaborRate(x.name);
      c += (Number(x.st)||0)*r + (Number(x.ot)||0)*r*1.5;
    });
    return { cost:c, estimated:false };
  }
  const n = Number(D.onCrew) || (D.roster||[]).filter(x => x.kind === 'Labor').length || 0;
  const hrs = hoursFrom(D);
  if (n && hrs) return { cost:n*hrs*blendedLaborCost(), estimated:true };
  return { cost:0, estimated:false, missing:true };
}
/** clocked hours when the crew used the time screen, otherwise the typed start/stop */
function hoursFrom(D){
  if (D.startedAt && D.endedAt) return Math.max(0, (new Date(D.endedAt) - new Date(D.startedAt)) / 36e5);
  const p = s2 => {
    const m = String(s2||'').match(/^(\d{1,2}):?(\d{2})?\s*([ap])?/i);
    if (!m) return null;
    let h = +m[1] + (+(m[2]||0))/60;
    const ap = (m[3]||'').toLowerCase();
    if (ap === 'p' && h < 12) h += 12;
    if (ap === 'a' && h >= 12) h -= 12;
    return h;
  };
  const a = p(D.start), b = p(D.stop);
  return a != null && b != null && b > a ? b - a : 0;
}
function allDays(){
  return Object.keys(S.days).map(k => {
    const D = S.days[k];
    const [date, crew] = k.includes('|') ? k.split('|') : [k, D.crew || ''];
    return Object.assign({}, D, { key:k, date:D.date || date, crew:D.crew || crew });
  }).filter(D => D.date);
}
/** cost per date, optionally allocated to one work order pro-rata on that day's revenue */
function costByDay(sc){
  const out = {}, est = {};
  allDays().forEach(D => {
    const c = dayCost(D);
    if (!c.cost) return;
    out[D.date] = (out[D.date]||0) + c.cost;
    if (c.estimated) est[D.date] = true;
  });
  if (sc === 'all') return { cost:out, est };
  const scoped = {}, all = revenueByDay('all'), one = revenueByDay(sc);
  one.forEach(d => {
    const tot = (all.find(x => x.date === d.date) || {}).total || 0;
    scoped[d.date] = tot ? (out[d.date]||0) * (d.total/tot) : 0;
  });
  return { cost:scoped, est };
}
function marginOf(sc){
  const rev = revenueByDay(sc).reduce((s,d)=>s+d.total,0);
  const cb = costByDay(sc);
  const cost = Object.values(cb.cost).reduce((a,b)=>a+b,0);
  const anyEst = Object.keys(cb.est).length;
  const noRoster = allDays().filter(D => dayCost(D).missing).length;
  return { rev, cost, margin:rev-cost, pct: rev ? (rev-cost)/rev*100 : 0, anyEst, noRoster, days:allDays().length };
}

/* ---------- crew attribution ---------- */
function crewOf(p){ return rec(p.id).crew || null; }
function crewStats(sc){
  const m = {};
  const g = c => m[c] = m[c] || { crew:c, pts:0, units:0, adders:0, rev:0, addRev:0, rej:0, sub:0, cost:0 };
  scopePts(sc).forEach(p => {
    const r = rec(p.id), t = ptTotals(p);
    if (!t.total && !r.crew) return;
    const c = r.crew || 'unassigned'; g(c);
    m[c].pts++; m[c].units += t.done; m[c].adders += r.adders.length;
    m[c].rev += t.total; m[c].addRev += t.add;
    if (r.qa && r.qa.result === 'sent back') m[c].rej++;
    if (r.submittedAt || r.qa) m[c].sub++;
  });
  allDays().forEach(D => { const c = D.crew || 'unassigned'; if (!m[c]) return; m[c].cost += dayCost(D).cost; });
  return Object.values(m).sort((a,b) => b.rev - a.rev);
}

/* ---------- aging ---------- */
const HOURS = (a,b) => (new Date(b) - new Date(a)) / 36e5;
function aging(sc){
  let approvedNotBilled = 0, oldestWait = 0, waits = [], toBill = [], subToAppr = [], apprToBill = [];
  scopePts(sc).forEach(p => {
    const r = rec(p.id), t = ptTotals(p);
    if (r.status === 'ready_invoice'){ approvedNotBilled += t.total; toBill.push(p); }
    if (r.status === 'ready_audit' && r.submittedAt){
      const h = HOURS(r.submittedAt, new Date().toISOString());
      waits.push(h); oldestWait = Math.max(oldestWait, h);
    }
    if (r.submittedAt && r.approvedAt) subToAppr.push(HOURS(r.submittedAt, r.approvedAt));
    if (r.approvedAt && r.billedAt) apprToBill.push(HOURS(r.approvedAt, r.billedAt)/24);
  });
  const avg = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : 0;
  return { approvedNotBilled, oldestWait, waiting:waits.length, toBill,
           avgQAHours:avg(subToAppr), avgBillDays:avg(apprToBill) };
}
function bottlenecks(sc){
  const over = [], rej = [], noPhoto = [], idle = [], susp2 = [], unassigned = [];
  const now = Date.now();
  scopePts(sc).forEach(p => {
    const r = rec(p.id), t = ptTotals(p);
    if (r.status === 'ready_audit' && r.submittedAt && HOURS(r.submittedAt, new Date().toISOString()) > 24) over.push(p);
    if (r.status === 'correction') rej.push(p);
    if (ST[r.status].step >= STEP_BUILD && photoShort(p.id).length) noPhoto.push(p);
    if (r.status === 'in_progress' && r.dates.length){
      const last = r.dates.slice().sort().pop();
      if ((now - new Date(last+'T12:00:00').getTime())/864e5 > 3) idle.push(p);
    }
  });
  scopePts(sc).forEach(p => {
    const r = rec(p.id);
    if (r.status === 'pending_suspense') susp2.push(p);
    if (r.status === 'ready_construction') unassigned.push(p);
  });
  return { over, rej, noPhoto, idle, susp:susp2, unassigned };
}

  section: { lbl:'Section',  fn:(a,b) => (a.wo+a.sec).localeCompare(b.wo+b.sec) || String(a.pt).localeCompare(String(b.pt), undefined, {numeric:true}) },
  value:   { lbl:'Booked',   fn:(a,b) => ptTotals(b).total - ptTotals(a).total },
  est:     { lbl:'Estimate', fn:(a,b) => ptTotals(b).estValue - ptTotals(a).estValue },
  variance:{ lbl:'Variance', fn:(a,b) => Math.abs(ptTotals(b).total - ptTotals(b).estValue) - Math.abs(ptTotals(a).total - ptTotals(a).estValue) },
  crew:    { lbl:'Crew',     fn:(a,b) => String(rec(a.id).crew||'zz').localeCompare(String(rec(b.id).crew||'zz')) },
  needs:   { lbl:'Blockers', fn:(a,b) => pointNeeds(b.id).length - pointNeeds(a.id).length }

/** whatever is standing between this point and its next stage */
function pointNeeds(id){
  const st = ST[rec(id).status].step;
  if (st < ST.ready_construction.step) return preconBlockers(id);
  if (st === ST.ready_construction.step) return ['no crew assigned'];
  if (st >= STEP_BUILD && st < STEP_AUDIT) return auditBlockers(id);
  if (rec(id).status === 'ready_audit') return ['with the GF'];
  if (rec(id).status === 'ready_invoice') return ['to invoice'];
  return [];
}

function dropToPrecon(clearWork){
  const n = PTS.length;
  const msg = clearWork
    ? `Erase all booked units, adders, T&E, photos, crew assignments, suspense answers and time logs on all ${n} work points, and hand every one of them to the specialist to ride out?\n\nThis cannot be undone.`
    : `Send all ${n} work points back to the start of pre-con and release the rate locks, keeping the booked work, photos and time logs?`;
  if (!confirm(msg)) return;
  PTS.forEach(p => {
    if (clearWork) delete S.pts[p.id];
    const r = rec(p.id);
    if (!clearWork){
      r.crew = null; r.susp = null; r.qa = null;
      r.submitted = r.submittedAt = r.approvedAt = r.billedAt = r.assignedAt = r.ratesLockedAt = null;
      p.units.forEach(u => { const e = r.units[u.seq]; if (e){ e.locked = false; e.rate = null; } });
      r.adders.forEach(a => a.locked = false);
      r.te.forEach(x => x.locked = false);
    }
    r.status = 'new';
    hist(p.id, clearWork ? 'Job reset — handed to the specialist to ride out'
                         : 'Sent back to the start of pre-con');
    if (!clearWork) evalPrecon(p.id);
  });
  if (clearWork){ S.days = {}; DFRCREW = null; }
  S.settings.filter = 'all';
  applyRateOverrides();
  save(); drawPins(); renderAll();
  const still = PTS.filter(p => rec(p.id).status === 'new').length;
  toast(`${still} of ${n} points are with the specialist to ride out`, 'ok');
}

const MI = (a,b) => {                                  // straight-line miles
  const R = 3958.8, dLat = (b.lat-a.lat)*Math.PI/180, dLng = (b.lng-a.lng)*Math.PI/180;
  const la = a.lat*Math.PI/180, lb = b.lat*Math.PI/180;
  const h = Math.sin(dLat/2)**2 + Math.cos(la)*Math.cos(lb)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
};
const mi = n => n < 0.1 ? Math.round(n*5280) + ' ft' : n.toFixed(1) + ' mi';

const ROUTE_KINDS = {
  precon:   { lbl:'To ride out',        who:['specialist','pm','office','gf'],
              test:p => ['new','pending_suspense'].includes(rec(p.id).status) },
  mine:     { lbl:"My crew's work",     who:['foreman','gf','pm'],
              test:p => rec(p.id).crew === S.settings.crew &&
                        ST[rec(p.id).status].step >= STEP_BUILD && ST[rec(p.id).status].step < STEP_LOCKED },
  audit:    { lbl:'To audit',           who:['gf','pm'],
              test:p => rec(p.id).status === 'ready_audit' },
  filter:   { lbl:'Whatever is filtered', who:['specialist','foreman','gf','pm','office'],
              test:p => matchFilter(p, S.settings.filter) }
};

/** greedy nearest-neighbour from a start point — on a pole line this walks the line */
function buildRoute(kind, from){
  const k = ROUTE_KINDS[kind]; if (!k) return [];
  const pool = PTS.filter(p => k.test(p) && coord(p));
  if (!pool.length) return [];
  let cur = from;
  if (!cur){                                            // no fix — start at the west end
    const w = pool.reduce((a,b) => coord(b).lng < coord(a).lng ? b : a, pool[0]);
    cur = coord(w);
  }
  const left = pool.slice(), out = [];
  while (left.length){
    let bi = 0, bd = Infinity;
    left.forEach((p,i) => { const d = MI(cur, coord(p)); if (d < bd){ bd = d; bi = i; } });
    const p = left.splice(bi,1)[0];
    out.push(p.id); cur = coord(p);
  }
  return out;
}
function routeMiles(ids, from){
  let m = 0, cur = from;
  ids.forEach(id => { const c = coord(pt(id)); if (cur) m += MI(cur, c); cur = c; });
  return m;
}
function route(){ return S.settings.route = S.settings.route || { kind:null, ids:[], done:[], from:null }; }
function routeLeft(){ const R = route(); return R.ids.filter(id => !R.done.includes(id)); }

function planRoute(kind){
  const R = route();
  const go2 = from => {
    R.kind = kind; R.from = from || null;
    R.ids = buildRoute(kind, from); R.done = [];
    save(); drawPins(); renderAll();
    if (!R.ids.length){ toast('Nothing to route in that list','bad'); return; }
    toast(`${R.ids.length} stops · ${mi(routeMiles(R.ids, from))} of driving`, 'ok');
    go('map'); fitRoute();
  };
  if (!navigator.geolocation){ go2(null); return; }
  toast('Getting your position…');
  navigator.geolocation.getCurrentPosition(
    pos => go2({ lat:pos.coords.latitude, lng:pos.coords.longitude }),
    ()  => { toast('No GPS fix — routing from the west end of the job'); go2(null); },
    { enableHighAccuracy:true, timeout:8000 }
  );
}
/** a point that releases itself out of "not ridden" is ticked off the route automatically */
function routeAutoTick(id){
  const R = S.settings.route;
  if (!R || !R.ids || !R.ids.includes(id)) return;
  if (!R.done.includes(id)) R.done.push(id);
}
function routeDone(id){
  const R = route();
  if (!R.done.includes(id)) R.done.push(id);
  save(); drawPins(); renderAll();
  const left = routeLeft();
  toast(left.length ? `${left.length} stop${left.length===1?'':'s'} left` : 'Route finished', 'ok');
}
function routeUndo(id){
  const R = route();
  R.done = R.done.filter(x => x !== id);
  save(); drawPins(); renderAll();
}
function routeClear(){
  S.settings.route = { kind:null, ids:[], done:[], from:null };
  save(); drawPins(); renderAll(); toast('Route cleared');
}
function routeReorderFromHere(){
  const R = route();
  if (!navigator.geolocation){ toast('No geolocation on this device','bad'); return; }
  toast('Re-ordering from where you are…');
  navigator.geolocation.getCurrentPosition(pos => {
    const from = { lat:pos.coords.latitude, lng:pos.coords.longitude };
    const left = routeLeft();
    let cur = from; const out = [];
    const pool = left.slice();
    while (pool.length){
      let bi = 0, bd = Infinity;
      pool.forEach((id,i) => { const d = MI(cur, coord(pt(id))); if (d < bd){ bd = d; bi = i; } });
      const id = pool.splice(bi,1)[0]; out.push(id); cur = coord(pt(id));
    }
    R.ids = R.done.concat(out); R.from = from;
    save(); drawPins(); renderAll(); fitRoute();
    toast('Re-ordered from your position', 'ok');
  }, () => toast('Could not get a fix','bad'), { enableHighAccuracy:true, timeout:8000 });
}

/* ---------- hand off to the phone's nav app ---------- */
function navTo(id){
  const c = coord(pt(id)); if (!c){ toast('That point has no position','bad'); return; }
  window.open(`https://www.google.com/maps/dir/?api=1&destination=${c.lat},${c.lng}&travelmode=driving`, '_blank');
}
/** Google Maps takes an origin, a destination and up to 9 waypoints in one link */
let NAVLEGS = [], NAVFROM = null;
function navRoute(){
  const R = route(), left = routeLeft();
  if (!left.length){ toast('No stops left','bad'); return; }
  NAVFROM = R.from; NAVLEGS = [];
  for (let i = 0; i < left.length; i += 10) NAVLEGS.push(left.slice(i, i+10));
  if (NAVLEGS.length === 1){ navLeg(0); return; }
  openSheet(`${left.length} stops — ${NAVLEGS.length} legs`,
    `<p class="hint">Google Maps takes ten stops per link, so this route splits into ${NAVLEGS.length} legs.
      Run them in order — each one opens in Maps with the stops already in it.</p><div style="height:10px"></div>` +
    NAVLEGS.map((leg,i) => `<button class="btn wide" style="margin-bottom:8px" onclick="navLeg(${i})">
      Leg ${i+1} — ${leg.length} stops, ${label(pt(leg[0]))} to ${label(pt(leg[leg.length-1]))}</button>`).join(''));
}
function navLeg(i){
  const leg = NAVLEGS[i]; if (!leg) return;
  const cs = leg.map(id => coord(pt(id))).filter(Boolean).map(c => `${c.lat},${c.lng}`);
  if (!cs.length){ toast('No positions on that leg','bad'); return; }
  const dest = cs.pop();
  let org;
  if (i === 0 && NAVFROM) org = `${NAVFROM.lat},${NAVFROM.lng}`;
  else if (cs.length) org = cs.shift();
  else org = dest;
  const wp = cs.length ? '&waypoints=' + cs.join('|') : '';
  closeSheet();
  window.open(`https://www.google.com/maps/dir/?api=1&origin=${org}&destination=${dest}${wp}&travelmode=driving`, '_blank');
}

/* ---------- map layer ---------- */
let ROUTELINE = null, ROUTEDOTS = [];
function drawRoute(){
  if (!MAP) return;
  if (ROUTELINE){ MAP.removeLayer(ROUTELINE); ROUTELINE = null; }
  ROUTEDOTS.forEach(m => MAP.removeLayer(m)); ROUTEDOTS = [];
  const R = route(); if (!R.ids.length) return;
  const pts = [];
  if (R.from) pts.push([R.from.lat, R.from.lng]);
  R.ids.forEach(id => { const c = coord(pt(id)); if (c) pts.push([c.lat, c.lng]); });
  if (pts.length < 2) return;
  ROUTELINE = L.polyline(pts, { color:'#eab308', weight:3, opacity:.85, dashArray:'7 5' }).addTo(MAP);
  R.ids.forEach((id,i) => {
    const c = coord(pt(id)); if (!c) return;
    const done = R.done.includes(id);
    ROUTEDOTS.push(L.marker([c.lat,c.lng], { zIndexOffset:900, icon:L.divIcon({
      className:'', iconSize:[18,18], iconAnchor:[-8,26],
      html:`<b class="routeN${done?' done':''}">${done?'✓':i+1}</b>` }) }).addTo(MAP));
  });
}
function fitRoute(){
  const R = route(); if (!MAP || !R.ids.length) return;
  const cs = R.ids.map(id => coord(pt(id))).filter(Boolean).map(c => [c.lat,c.lng]);
  if (R.from) cs.push([R.from.lat, R.from.lng]);
  if (cs.length) MAP.fitBounds(L.latLngBounds(cs).pad(0.18));
}

/* ---------- KMZ / KML / CSV / GeoJSON import ---------- */
document.getElementById('kmzin').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const nm = f.name.toLowerCase();
  const done = txt => importPlacemarks(parseAny(nm, txt));
  if (nm.endsWith('.kmz')){
    if (typeof JSZip === 'undefined'){ toast('KMZ needs the unzip library — no connection?','bad'); return; }
    f.arrayBuffer().then(b => JSZip.loadAsync(b)).then(z => {
      const k = Object.keys(z.files).find(n => n.toLowerCase().endsWith('.kml'));
      if (!k) throw new Error('no kml inside');
      return z.files[k].async('string');
    }).then(t => done(t)).catch(err => toast('Could not read that KMZ: ' + err.message,'bad'));
  } else {
    f.text().then(done).catch(() => toast('Could not read that file','bad'));
  }
  e.target.value = '';
};
function parseAny(name, txt){
  const out = [];
  if (name.endsWith('.csv')){
    const lines = txt.trim().split(/\r?\n/);
    const hdr = lines[0].split(',').map(s => s.trim().toLowerCase());
    const iN = hdr.findIndex(h => /name|id|pole|point/.test(h));
    const iLa = hdr.findIndex(h => /lat/.test(h)), iLo = hdr.findIndex(h => /lon|lng/.test(h));
    lines.slice(1).forEach(l => {
      const c = l.split(',');
      if (c[iLa] && c[iLo]) out.push({ name:(c[iN]||'').trim(), lat:+c[iLa], lng:+c[iLo] });
    });
    return out;
  }
  if (name.endsWith('.json') || name.endsWith('.geojson')){
    const j = JSON.parse(txt);
    (j.features||[]).forEach(ft => {
      const g = ft.geometry || {}; if (!g.coordinates) return;
      const c = g.type === 'Point' ? g.coordinates : g.coordinates.flat(9).slice(0,2);
      const pr = ft.properties || {};
      out.push({ name:String(pr.name||pr.Name||pr.NAME||pr.id||''), lng:+c[0], lat:+c[1] });
    });
    return out;
  }
  const doc = new DOMParser().parseFromString(txt, 'text/xml');
  doc.querySelectorAll('Placemark').forEach(pm => {
    const nEl = pm.querySelector('name');
    const co = pm.querySelector('Point coordinates') || pm.querySelector('coordinates');
    if (!co) return;
    const first = co.textContent.trim().split(/\s+/)[0].split(',');
    let extra = '';
    pm.querySelectorAll('SimpleData,Data value,description').forEach(d => extra += ' ' + d.textContent);
    out.push({ name:((nEl?nEl.textContent:'') + extra).trim(), lng:+first[0], lat:+first[1] });
  });
  return out;
}
function importPlacemarks(list){
  list = list.filter(x => isFinite(x.lat) && isFinite(x.lng));
  if (!list.length) { toast('No points found in that file','bad'); return; }
  let hit = 0, miss = [];
  list.forEach(x => {
    const p = matchPoint(x.name);
    if (p) { rec(p.id).coord = { lat:x.lat, lng:x.lng, src:'kmz' }; hist(p.id,'Position imported from '+ (x.name||'file')); hit++; }
    else miss.push(x.name || '(unnamed)');
  });
  save(); drawPins(); fitJob(); renderSet();
  openSheet('Import result', `
    <p><b>${hit}</b> of ${list.length} placemarks matched a work point.</p>
    ${miss.length?`<p class="hint">Unmatched: ${esc(miss.slice(0,25).join(', '))}${miss.length>25?` … +${miss.length-25} more`:''}</p>
      <p class="hint">Matching looks for a grid ID like <span class="mono">31146-32814</span>, or a section + point such as
      "A Pt 12" / "A-12", in the placemark name or its attributes.</p>`:''}
    <button class="btn pri wide" style="margin-top:10px" onclick="closeSheet();go('map')">See the map</button>`);
}
function matchPoint(name){
  if (!name) return null;
  const g = name.match(/(\d{5})\s*[-–]\s*(\d{5})/);
  if (g){
    const key = g[1]+'-'+g[2];
    const p = PTS.find(p => p.grid === key);
    if (p) return p;
  }
  const m = name.toUpperCase().match(/\b([A-E])\b[^0-9A-Z]{0,6}(?:PT\.?\s*)?(R?\d{1,3}|[UW]\d{1,3})\b/);
  if (m){
    const p = PTS.find(p => p.wo === S.settings.wo && p.sec === m[1] && p.pt.toUpperCase() === m[2]);
    if (p) return p;
  }
  const m2 = name.toUpperCase().match(/\bP(?:T|OINT)?\.?\s*(\d{1,3})\b/);
  if (m2){
    const p = PTS.find(p => p.wo === S.settings.wo && p.pt === m2[1]);
    if (p) return p;
  }
  return null;
}

function seedDemo(){
  /* A believable week across the whole pipeline: two crews on the reconductor,
     one on the substation feed, and points sitting at every stage from New to
     Complete so each role's home screen has something real on it. */
  const dates = [];
  for (let i = 9; i >= 0; i--){
    const dt = new Date(); dt.setDate(dt.getDate()-i);
    if (dt.getDay() === 0 || dt.getDay() === 6) continue;
    dates.push(dt.toISOString().slice(0,10));
  }
  const ASSIGN = { '2677991':['412','418'], '2671633':['425'] };
  S.crews = ['412','418','425'];
  const FOREMAN = { '412':'R. Alvarez', '418':'T. Boone', '425':'M. Ruiz' };
  const roster = crew => ([
    { kind:'Labor', name:'LINE FOREMAN',    st:10, ot:crew==='412'?1:0 },
    { kind:'Labor', name:'JOURNEY LINEMAN', st:10, ot:crew==='412'?1:0 },
    { kind:'Labor', name:'JOURNEY LINEMAN', st:10, ot:0 },
    { kind:'Labor', name:'GROUNDMAN',       st:10, ot:0 },
    { kind:'Equipment', name:'Bucket Truck', st:10, ot:0 },
    { kind:'Equipment', name:'Line Truck / Digger Derrick', st:9, ot:0 }
  ]);
  /* tiny placeholder images so a few hundred of them still fit in device storage */
  const cv = document.createElement('canvas'); cv.width = cv.height = 150;
  const g = cv.getContext('2d');
  const TINT = { before:'#b49b7d', after:'#7d9ab4', switching:'#9b7db4', locate:'#b47d90', briefing:'#7db492' };
  const shot = (kind, p, i) => {
    g.fillStyle = TINT[kind] || '#888'; g.fillRect(0,0,150,150);
    g.fillStyle = 'rgba(0,0,0,.6)'; g.font = 'bold 15px sans-serif';
    g.fillText(kind.slice(0,9).toUpperCase() + (i?' '+i:''), 8, 74);
    g.font = '11px sans-serif'; g.fillText(p.sec + ' Pt ' + p.pt, 8, 92);
    return cv.toDataURL('image/jpeg', .4);
  };
  const addShots = (p, kind, n, d) => {
    const r = rec(p.id);
    for (let i = 1; i <= n; i++)
      r.photos.push({ id:'d'+p.id+kind+i, phase:kind, data:shot(kind,p,n>1?i:0),
                      ts:new Date(d+(kind==='after'?'T16:':'T08:')+(10+i)+':00').toISOString(), by:'foreman' });
  };
  const fillSusp = (p, opts) => {
    const sp = susp(p.id);
    sp.locates.needed = opts.loc;
    if (opts.loc){ sp.locates.ticket = 'FL-' + (2600000 + Math.abs(p.id.length*7919 + p.pt.length*31) % 99999);
      if (opts.locBack !== false){ sp.locates.submitted = opts.d1; sp.locates.received = opts.d2; }
      else sp.locates.submitted = opts.d1; }
    sp.mot.needed = opts.mot;
    if (opts.mot && opts.motOk !== false){ sp.mot.plan = 'MOT-' + p.pt; sp.mot.confirmed = opts.d1; }
    sp.switching.needed = opts.sw;
    if (opts.sw){ sp.switching.ordered = opts.d1;
      if (opts.swNum !== false) sp.switching.number = 'SO-' + (48000 + Math.abs(p.pt.length*13 + p.sec.charCodeAt(0)) % 900); }
  };
  const yday = dates[dates.length-2] || dates[0], d0 = dates[0];

  const queue = {}; Object.keys(ASSIGN).forEach(wo => queue[wo] = jobPts(wo).filter(p => p.units.length).slice());
  const last = dates.length - 1, prev = dates.length - 2;
  let n = 0;

  /* ---- worked points, ageing through build → audit → invoice ---- */
  dates.forEach((d, di) => {
    Object.keys(ASSIGN).forEach(wo => ASSIGN[wo].forEach(crew => {
      const perDay = crew === '425' ? 2 : (di % 3 === 0 ? 3 : 2);
      for (let k = 0; k < perDay; k++){
        const p = queue[wo].shift(); if (!p) return;
        const r = rec(p.id); n++;
        r.crew = crew; r.dates = [d];
        p.units.forEach((u, ui) => {
          const short = (n % 9 === 4) && ui === p.units.length - 1;
          r.units[u.seq] = { qty: short ? 0 : u.estQty, state: short ? 'not' : 'complete', date:d,
            note: short ? 'Pole not set — waiting on TECO clearance' : '' };
        });
        if (n % 4 === 0){
          const a2 = CATBY['4000'] || CAT[8];
          r.adders.push({ code:a2.code, desc:a2.desc, uom:a2.uom, rate:a2.rate, qty:1,
                          note:'Auth: TECO insp. R. Diaz', date:d });
        }
        if (n % 5 === 0){
          const L = LAB.find(x => x.name === 'JOURNEY LINEMAN') || LAB[0];
          r.te.push({ kind:'Labor', name:L.name, rateST:L.st, rateOT:L.ot, st:3, ot:0, date:d });
        }
        const needsSw = n % 3 === 0, needsLoc = n % 2 === 0, needsMot = n % 5 === 2;
        const swMissing = n % 11 === 3;
        fillSusp(p, { loc:needsLoc, mot:needsMot, sw:needsSw, d1:d, d2:d, swNum: !swMissing });

        const stage = di === last ? 'in_progress'
                    : di === prev ? 'ready_audit'
                    : (n % 13 === 5 || swMissing) ? 'correction'
                    : di <= 1 ? 'complete' : 'ready_invoice';
        r.status = stage;
        const sub = new Date(d+'T17:10:00').toISOString();
        const full = stage !== 'in_progress';
        addShots(p, 'before', 5, d);
        addShots(p, 'after',  full ? 5 : 2, d);
        if (full || n % 2) addShots(p, 'briefing', 1, d);
        if (needsLoc) addShots(p, 'locate', 1, d);
        if (needsSw && !swMissing) addShots(p, 'switching', 1, d);
        r.preconAt = new Date(d + 'T07:30:00').toISOString(); r.preconBy = 'specialist';
        if (stage === 'ready_audit'){
          r.submitted = r.submittedAt = sub;
          if (n % 7 === 0){ const old = new Date(); old.setHours(old.getHours()-31); r.submittedAt = r.submitted = old.toISOString(); }
        } else if (stage === 'correction'){
          r.submittedAt = sub;
          r.qa = { result:'immediate correction required', by:'General Foreman',
                   ts:new Date(d+'T19:50:00').toISOString(),
                   note: swMissing ? 'Switching order number not entered on the point.'
                                   : 'After photos do not show the completed framing — reshoot.' };
        } else if (stage === 'ready_invoice' || stage === 'complete'){
          r.submittedAt = sub;
          r.approvedAt = new Date(d+'T19:30:00').toISOString();
          r.qa = { result:'passed', by:'General Foreman', ts:r.approvedAt, note:'Framing and grounding verified.' };
          lockRates(p.id);
          if (stage === 'complete'){ const bd = new Date(d+'T10:00:00'); bd.setDate(bd.getDate()+2); r.billedAt = bd.toISOString(); }
        }
        if (stage === 'in_progress' && n % 3 === 0){
          r.progress = [{ ts:new Date(d+'T16:30:00').toISOString(), date:d, crew,
            done:ptTotals(p).done, part:ptTotals(p).part, planned:p.units.length,
            note:'Pole set, framing left — coming back with the digger' }];
          r.carry = true;
        }
        hist(p.id, 'Sample data seeded');
      }
    }));
    S.crews.forEach(crew => {
      const D = dayRec(d, crew);
      D.foreman = FOREMAN[crew]; D.weather = 'Hot, PM storms'; D.jsa = 'Complete';
      D.onCrew = '4';
      const startH = 7, endH = crew === '412' ? 18 : 17.5;
      D.startedAt = new Date(d + 'T07:00:00').toISOString();
      D.start = new Date(D.startedAt).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
      if (!(di === last)){                                   // today is left running
        const eh = Math.floor(endH), em = Math.round((endH-eh)*60);
        D.endedAt = new Date(d + 'T' + String(eh).padStart(2,'0') + ':' + String(em).padStart(2,'0') + ':00').toISOString();
        D.stop = new Date(D.endedAt).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
      }
      if (!(di === last && crew === '425')) D.roster = roster(crew);
      // arrive / depart log for the points this crew touched that day
      const touched = PTS.filter(p => rec(p.id).crew === crew && rec(p.id).dates.includes(d));
      let h = 7.75;
      touched.forEach((p,ti) => {
        const dur = ti === touched.length-1 ? 3 : 2.5;
        const t0 = new Date(d + 'T00:00:00'); t0.setMinutes(Math.round(h*60));
        const t1 = new Date(t0); t1.setMinutes(t1.getMinutes() + Math.round(dur*60));
        const running = (di === last && ti === touched.length-1);
        D.visits.push({ id:'v'+p.id+d, ptId:p.id, in:t0.toISOString(),
                        out: running ? null : t1.toISOString(),
                        note: running ? '' : (ti === touched.length-1 ? 'submitted for audit' : '') });
        h += dur + 0.4;                                       // travel between poles
      });
    });
  });

  /* ---- the front of the pipeline: not built yet ---- */
  const front = [];
  Object.keys(ASSIGN).forEach(wo => front.push(...queue[wo].splice(0, 14)));
  front.forEach((p, i) => {
    const r = rec(p.id), m = i % 7;
    if (m === 0 || m === 1 || m === 2){
      r.status = 'new';                                        // not ridden out — no before photos
    }
    else if (m === 3){                                         // ridden, waiting on locates
      addShots(p, 'before', 5, yday);
      fillSusp(p, { loc:true, mot:false, sw:false, d1:yday, locBack:false });
      addShots(p, 'briefing', 1, yday);
    }
    else if (m === 4){                                         // ridden, switching order on order
      addShots(p, 'before', 5, yday);
      fillSusp(p, { loc:false, mot:true, sw:true, d1:yday, swNum:false });
    }
    else if (m === 5){                                         // ridden and clear
      addShots(p, 'before', 5, yday);
      fillSusp(p, { loc:true, mot:true, sw:true, d1:yday, d2:d0 });
      addShots(p, 'locate', 1, yday);
    }
    else {                                                     // assigned, not started
      addShots(p, 'before', 5, yday);
      fillSusp(p, { loc:false, mot:false, sw:true, d1:yday });
      r.crew = S.crews[i % S.crews.length]; r.assignedAt = new Date().toISOString();
    }
    hist(p.id, 'Sample data seeded');
    if (m > 2){
      r.preconAt = new Date(yday + 'T09:00:00').toISOString(); r.preconBy = 'specialist';
      r.status = suspDone(p.id) ? 'ready_construction' : 'pending_suspense';
      if (m === 6){ r.status = 'assigned'; r.assignedAt = new Date().toISOString(); }
    }
  });

  S.settings.crew = '412'; S.settings.foreman = FOREMAN['412'];
  S.settings.filter = 'all'; S.settings.view = null;
  save(); drawPins(); fitJob(); renderAll();
  const staged = {}; PTS.forEach(p => { const k = rec(p.id).status; staged[k] = (staged[k]||0)+1; });
  toast(`Sample job loaded — ${n} points built, ${front.length} in pre-con, every stage populated`, 'ok');
}
/* ---------- sync chip ---------- */
function renderSync(){
  const el = document.getElementById('syncpill'), t = document.getElementById('synctxt');
  const on = navigator.onLine;
  if (!on){ el.className = 'pill off'; t.textContent = (S.pending?S.pending+' queued':'offline'); return; }
  if (S.pending){ el.className = 'pill'; t.textContent = 'syncing ' + S.pending;
    clearTimeout(renderSync.t);
    renderSync.t = setTimeout(() => { S.pending = 0; try{Store.set(JSON.stringify(S));}catch(e){} renderSync(); }, 900);
  } else { el.className = 'pill on'; t.textContent = 'synced'; }
}
window.addEventListener('online', renderSync);
window.addEventListener('offline', renderSync);

/* ---------- boot ---------- */
function renderAll(){
  renderSync(); drawPins();
  const act = document.querySelector('.view.active');
  const v = act ? act.id.slice(2) : 'map';
  if (v === 'list') renderList(); else if (v === 'qa') renderQA();
  else if (v === 'dfr') renderDFR(); else if (v === 'set') renderSet();
  else if (v === 'home') renderHome();
  else if (v === 'point' && CUR) renderPoint(CUR);
  const wait = PTS.filter(p => rec(p.id).status === 'ready_audit').length;
  const b = document.getElementById('qabadge');
  b.textContent = wait || ''; b.className = wait ? 'badge' : '';
}
window.addEventListener('load', () => {
  const sel = document.getElementById('role');
  if (S.settings.role) sel.value = S.settings.role;
  migrateStatus(); applyRateOverrides(); migrateLocks();
  if (typeof DEMO_BUILD !== 'undefined' && DEMO_BUILD){
    const el = document.createElement('span');
    el.className = 'pill'; el.style.cssText = 'border-color:#f59e0b;color:#f59e0b';
    el.innerHTML = '<i class="dot"></i>demo rates';
    document.querySelector('header .grow').after(el);
  }
  applyRole(); initMap(); renderAll();
  if (!Store.persistent) setTimeout(() => toast('Storage is blocked in this viewer — export before closing','bad'), 1200);
});
window.addEventListener('beforeprint', () => { if (MAP) MAP.invalidateSize(); });

</script>
